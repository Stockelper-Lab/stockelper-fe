name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # 또는 master, 원하는 브랜치명으로 변경
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare deployment directory on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'ENDSSH'
            # 배포 디렉토리 생성
            mkdir -p $DEPLOY_PATH
            
            # 디렉토리 권한 설정
            if [ ! -w "$DEPLOY_PATH" ]; then
              echo "⚠️  디렉토리 쓰기 권한이 없습니다. 권한을 설정합니다."
              sudo mkdir -p $DEPLOY_PATH
              sudo chown -R $USER:$USER $DEPLOY_PATH
              sudo chmod -R 755 $DEPLOY_PATH
            fi
            
            echo "✅ 배포 디렉토리 준비 완료: $DEPLOY_PATH"
          ENDSSH

      - name: Deploy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          echo "📦 프로젝트 파일을 EC2로 전송합니다..."
          echo "배포 경로: $DEPLOY_PATH"
          
          # deploy.sh 파일이 존재하는지 확인
          if [ ! -f "deploy.sh" ]; then
            echo "❌ 로컬에 deploy.sh 파일이 없습니다!"
            exit 1
          fi
          
          echo "✅ deploy.sh 파일 확인됨"
          
          # 프로젝트 파일을 EC2로 전송 (deploy.sh 포함)
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env*' \
            --exclude '*.log' \
            --exclude '.github' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ $EC2_USER@$EC2_HOST:$DEPLOY_PATH/
          
          if [ $? -eq 0 ]; then
            echo "✅ 파일 전송 완료"
          else
            echo "❌ 파일 전송 실패"
            exit 1
          fi

      - name: Verify files and run deployment script on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST bash << EOF
            set -e
            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            
            echo "📁 배포 경로 확인: \$DEPLOY_PATH"
            cd "\$DEPLOY_PATH" || exit 1
            
            echo "📋 전송된 파일 확인:"
            ls -la | head -20
            
            if [ ! -f "deploy.sh" ]; then
              echo "❌ deploy.sh 파일을 찾을 수 없습니다."
              echo "현재 디렉토리: \$(pwd)"
              echo "디렉토리 내용:"
              ls -la
              exit 1
            fi
            
            echo "✅ deploy.sh 파일 확인됨"
            chmod +x deploy.sh
            ./deploy.sh
          EOF

